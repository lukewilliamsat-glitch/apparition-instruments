name: Atlas release validation (no deployment)
on:
  push:
    branches: [atlas/phase2g-certification-closure]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-validation:
    if: github.ref == 'refs/heads/atlas/phase2g-certification-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: '22'
      - name: Assert Node 22
        run: node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1); console.log(process.version)"
      - name: Validate only offline Atlas fixtures under inherited kernel network denial
        run: python3 tests/atlas/run-offline.py --node "$(command -v node)" --evidence "$RUNNER_TEMP/atlas-validation"
      - name: Show focused results
        if: always()
        run: |
          for name in network-probes atlas-tests synthetic-demo; do
            if [ -f "$RUNNER_TEMP/atlas-validation/$name.stdout.txt" ]; then
              cat "$RUNNER_TEMP/atlas-validation/$name.stdout.txt"
            fi
          done
