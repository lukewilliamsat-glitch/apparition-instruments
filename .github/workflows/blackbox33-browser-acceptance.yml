name: BLACKBOX 33 isolated browser feasibility

on:
  push:
    branches: ['engineering/blackbox33-browser-verification']
    paths:
      - '.github/workflows/blackbox33-browser-acceptance.yml'
      - 'tests/blackbox33/**'

permissions:
  contents: read

concurrency:
  group: blackbox33-isolated-browser
  cancel-in-progress: false

jobs:
  feasibility:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/blackbox33-browser-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Discover existing browser and isolated test tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blackbox33-evidence" "$RUNNER_TEMP/blackbox33-tools"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$browser" || { echo 'BLOCKED: no installed Chromium/Chrome'; exit 1; }
          printf '%s\n' "$browser" > "$RUNNER_TEMP/blackbox33-tools/browser-path"
          "$browser" --version | tee "$RUNNER_TEMP/blackbox33-evidence/browser-version.txt"
          node --version | tee "$RUNNER_TEMP/blackbox33-evidence/node-version.txt"
          # Official controller only, in disposable tooling; no app dependency or browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/blackbox33-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1
          npm view playwright-core@1.56.1 dist.integrity > "$RUNNER_TEMP/blackbox33-evidence/controller-integrity.txt"
      - name: Prove browser isolation before any application fixture
        shell: bash
        run: |
          set -euo pipefail
          browser=$(cat "$RUNNER_TEMP/blackbox33-tools/browser-path")
          sudo unshare --net --mount --pid --fork --mount-proc /bin/bash tests/blackbox33/run-isolated.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/blackbox33-evidence" "$(command -v node)" "$browser" \
            "$RUNNER_TEMP/blackbox33-tools/node_modules/playwright-core/index.mjs" "$(id -un)" "$(readlink /proc/self/ns/net)"
      - name: Retain feasibility evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox33-feasibility
          path: |
            ${{ runner.temp }}/blackbox33-evidence/*.json
            ${{ runner.temp }}/blackbox33-evidence/*.txt
          retention-days: 14
          if-no-files-found: warn
