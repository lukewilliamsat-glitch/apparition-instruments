name: COMMAND 04 isolated IRONCLAD acceptance
on:
  push:
    branches: ['engineering/command04-ironclad']
    paths:
      - '.github/workflows/command04-acceptance.yml'
      - 'tests/command04/**'
      - 'prototypes/command04/**'
permissions:
  contents: read
concurrency:
  group: command04-ironclad
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/command04-ironclad'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Verify frozen source and prepare existing browser controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/command04-evidence" "$RUNNER_TEMP/command04-tools"
          python3 tests/command04/source-integrity.py "$RUNNER_TEMP/command04-evidence" "$GITHUB_SHA"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$browser"
          printf '%s\n' "$browser" > "$RUNNER_TEMP/command04-tools/browser-path"
          "$browser" --version > "$RUNNER_TEMP/command04-evidence/browser-version.txt"
          node --version > "$RUNNER_TEMP/command04-evidence/node-version.txt"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/command04-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1
          npm view playwright-core@1.56.1 dist.integrity > "$RUNNER_TEMP/command04-evidence/controller-integrity.txt"
          test "$(cat "$RUNNER_TEMP/command04-evidence/controller-integrity.txt")" = 'sha512-hutraynyn31F+Bifme+Ps9Vq59hKuUCz7H1kDOcBs+2oGguKkWTU50bBWrtz34OUWmIwpBTWDxaRPXrIXkgvmQ=='
      - name: Prove isolation then run disposable SQL, Node and browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          browser=$(cat "$RUNNER_TEMP/command04-tools/browser-path")
          sudo unshare --net --mount --pid --fork --mount-proc /bin/bash tests/command04/run-isolated.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/command04-evidence" "$(command -v node)" "$browser" \
            "$RUNNER_TEMP/command04-tools/node_modules/playwright-core/index.mjs" "$(id -un)" "$(readlink /proc/self/ns/net)" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command04-ironclad-text-evidence
          # Exact text allowlist: no screenshots, raw database files, profiles, seeds or credentials.
          path: |
            ${{ runner.temp }}/command04-evidence/IRONCLAD_SOURCE.json
            ${{ runner.temp }}/command04-evidence/SOURCE_IDENTITY.json
            ${{ runner.temp }}/command04-evidence/SOURCE_AFTER.json
            ${{ runner.temp }}/command04-evidence/NODE_RESULTS.json
            ${{ runner.temp }}/command04-evidence/POSTGRES_RESULTS.json
            ${{ runner.temp }}/command04-evidence/BROWSER_RESULTS.json
            ${{ runner.temp }}/command04-evidence/STAGE_A_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C01/NODE_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C01/BROWSER_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C02/NODE_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C02/BROWSER_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C03/NODE_RESULTS.json
            ${{ runner.temp }}/command04-evidence/C03/BROWSER_RESULTS.json
            ${{ runner.temp }}/command04-evidence/namespace-addresses.json
            ${{ runner.temp }}/command04-evidence/namespace-routes.json
            ${{ runner.temp }}/command04-evidence/namespace-id.txt
            ${{ runner.temp }}/command04-evidence/browser-version.txt
            ${{ runner.temp }}/command04-evidence/node-version.txt
            ${{ runner.temp }}/command04-evidence/controller-integrity.txt
          if-no-files-found: error
          retention-days: 30
