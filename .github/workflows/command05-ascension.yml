name: COMMAND05 ASCENSION isolated Admin acceptance
on:
  push:
    branches: ['engineering/command05-the-ascension']
    paths:
      - '.github/workflows/command05-ascension.yml'
      - 'dist/admin/command/**'
      - 'dist/admin/admin-gate.mjs'
      - 'dist/admin/application.mjs'
      - 'tests/command05/**'
permissions:
  contents: read
concurrency:
  group: command05-ascension-isolated
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/command05-the-ascension'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Prepare pinned test controllers and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/command05-evidence" "$RUNNER_TEMP/command05-tools"
          python3 tests/command05/module-closure.py
          python3 tests/command05/source-integrity.py "$RUNNER_TEMP/command05-evidence" "$GITHUB_SHA"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$browser"
          printf '%s\n' "$browser" > "$RUNNER_TEMP/command05-tools/browser-path"
          "$browser" --version > "$RUNNER_TEMP/command05-evidence/browser-version.txt"
          node --version > "$RUNNER_TEMP/command05-evidence/node-version.txt"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/command05-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1 happy-dom@20.14.5
          npm view playwright-core@1.56.1 dist.integrity > "$RUNNER_TEMP/command05-evidence/controller-integrity.txt"
          test "$(cat "$RUNNER_TEMP/command05-evidence/controller-integrity.txt")" = 'sha512-hutraynyn31F+Bifme+Ps9Vq59hKuUCz7H1kDOcBs+2oGguKkWTU50bBWrtz34OUWmIwpBTWDxaRPXrIXkgvmQ=='
          ln -s "$RUNNER_TEMP/command05-tools/node_modules" node_modules
      - name: Prove process isolation then exercise actual Admin with synthetic adapters
        shell: bash
        run: |
          set -euo pipefail
          browser=$(cat "$RUNNER_TEMP/command05-tools/browser-path")
          sudo unshare --net --mount --pid --fork --mount-proc /bin/bash tests/command05/run-isolated.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/command05-evidence" "$(command -v node)" "$browser" \
            "$RUNNER_TEMP/command05-tools/node_modules/playwright-core/index.mjs" "$(id -un)" "$(readlink /proc/self/ns/net)" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: command05-ascension-synthetic-visual-evidence
          # Authorisation51: synthetic data/interface only; no private production archives.
          path: |
            ${{ runner.temp }}/command05-evidence/*.json
            ${{ runner.temp }}/command05-evidence/*.txt
            ${{ runner.temp }}/command05-evidence/SCREENSHOTS/*.png
          if-no-files-found: error
          retention-days: 14
