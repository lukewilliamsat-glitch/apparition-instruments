name: BLACK LEDGER63 targeted acceptance
on:
  push:
    branches: [engineering/command63-black-ledger]
    paths: ['dist/admin/**', 'dist/commercial/**', 'dist/backend/providers.mjs', 'supabase/migrations/20261027140000_black_ledger_financial_v1.sql', 'tests/fixtures/email-preview-database.mjs', 'tests/command63/**', '.github/workflows/command63-black-ledger.yml']
permissions:
  contents: read
concurrency:
  group: black-ledger63-isolated
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          needed=false
          while IFS= read -r path; do
            case "$path" in
              tests/command63/finance-postgres17.mjs|tests/command63/pg17-result.mjs|tests/command63/pg17-result-test.mjs|docs/operations/black-ledger63/*|.github/workflows/command63-black-ledger.yml) ;;
              *) needed=true ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)
          echo "browser=$needed" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: scope
    if: needs.scope.outputs.browser == 'true' && github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/command63-black-ledger'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Prepare existing pinned controller and disposable evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rebirth-evidence" "$RUNNER_TEMP/rebirth-tools"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$browser"
          printf '%s\n' "$browser" > "$RUNNER_TEMP/rebirth-tools/browser-path"
          "$browser" --version > "$RUNNER_TEMP/rebirth-evidence/browser-version.txt"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/rebirth-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1 happy-dom@20.14.5 @electric-sql/pglite@0.5.8
          test "$(npm view playwright-core@1.56.1 dist.integrity)" = 'sha512-hutraynyn31F+Bifme+Ps9Vq59hKuUCz7H1kDOcBs+2oGguKkWTU50bBWrtz34OUWmIwpBTWDxaRPXrIXkgvmQ=='
          ln -s "$RUNNER_TEMP/rebirth-tools/node_modules" node_modules
      - name: Prove inherited network isolation then check only newly integrated Admin
        run: |
          set -euo pipefail
          browser=$(cat "$RUNNER_TEMP/rebirth-tools/browser-path")
          sudo unshare --net --mount --pid --fork --mount-proc /bin/bash tests/command63/run-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rebirth-evidence" "$(command -v node)" "$browser" "$RUNNER_TEMP/rebirth-tools/node_modules/playwright-core/index.mjs" "$(id -un)" "$(readlink /proc/self/ns/net)" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: black-ledger63-targeted-synthetic-acceptance
          path: |
            ${{ runner.temp }}/rebirth-evidence/*.json
            ${{ runner.temp }}/rebirth-evidence/*.txt
            ${{ runner.temp }}/rebirth-evidence/SCREENSHOTS/*.png
          retention-days: 14
          if-no-files-found: error

  native-postgres:
    needs: scope
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/command63-black-ledger'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: command63_fixture
          POSTGRES_USER: command63_fixture
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Install only the already declared fixture dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/fixture-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false @electric-sql/pglite@0.5.8
          ln -s "$RUNNER_TEMP/fixture-tools/node_modules" node_modules
      - name: Verify native PostgreSQL 17.6 concurrent financial receipts and rollback
        env:
          COMMAND63_NATIVE_FIXTURE: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: command63_fixture
          PGUSER: command63_fixture
          PGPASSWORD: disposable-ci-only
        run: |
          set -euo pipefail
          command -v psql
          node tests/command63/pg17-result-test.mjs
          node tests/command63/finance-postgres17.mjs | tee "$RUNNER_TEMP/finance-postgres17.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: black-ledger63-native-postgres17
          path: ${{ runner.temp }}/finance-postgres17.txt
          retention-days: 14
          if-no-files-found: warn
