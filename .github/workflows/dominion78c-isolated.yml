name: DOMINION 78C isolated foundations
on:
  push:
    branches: [engineering/dominion78c-foundations]
    paths: ['tests/dominion78c/**', '.github/workflows/dominion78c-isolated.yml']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: dominion78c_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55478:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dominion78c_fixture"
          --health-interval 5s --health-timeout 4s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Fixture contracts, packing, marketplace and commerce
        run: node --test tests/dominion78c/acceptance.test.mjs
      - name: Install disposable PostgreSQL client dependency
        run: npm install --prefix "$RUNNER_TEMP/dom78" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save pg@8.16.3
      - name: Native concurrent reservations and transactional stock proof
        run: |
          set -euo pipefail
          DOMINION_PG_MODULE="$RUNNER_TEMP/dom78/node_modules/pg" node tests/dominion78c/native.mjs
