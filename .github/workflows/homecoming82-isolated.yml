name: HOMECOMING 82 isolated cumulative acceptance
on:
  push:
    branches: [engineering/dominion78c-foundations]
    paths: ['tests/homecoming82/**', '.github/workflows/homecoming82-isolated.yml']
permissions:
  contents: read
  actions: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: dominion79_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55478:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dominion79_fixture"
          --health-interval 5s --health-timeout 4s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: release69b
          ref: 43a7c0ab2a1546b2cb7fffadc82613a02a109c7d
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: release-c
          ref: a1d9e41fd4443f92f050c013c7bb1b70fa67568c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned disposable test dependencies
        run: npm install --prefix "$RUNNER_TEMP/dom79" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save pg@8.16.3 playwright@1.62.1
      - name: Native isolated integration with exact A, B and C SQL
        env:
          DOMINION_ACCEPTED_ROOT: ${{ github.workspace }}/release69b
          DOMINION_C_SQL: ${{ github.workspace }}/release-c/supabase/migrations/20261117162718_omniscience74_v1.sql
        run: |
          set -euo pipefail
          python3 tests/homecoming82/rebase-integration.py tests/dominion78c/integration79.mjs
          DOMINION_PG_MODULE="$RUNNER_TEMP/dom79/node_modules/pg" node tests/dominion78c/.integration82-generated.mjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sentinel
          ref: 7fc5a1dcbf94064a5ec23831fcf2205047259294
          persist-credentials: false
      - name: Run existing storefront and Admin suite against sealed Stage B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/dom79"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14643717958/zip" > "$w/stageb-review.zip"
          unset GH_TOKEN
          python3 tests/homecoming82/unpack-stageb.py "$w/stageb-review.zip" "$w"
          node --no-warnings --experimental-vm-modules sentinel/tests/release-a77a/graph.cjs "$w" unified-c
          python3 - "$w" <<'PYCODE'
          import json,pathlib,sys
          for graph in json.loads((pathlib.Path(sys.argv[1])/'graph-deepwatch.json').read_text()):
           assert not graph['badSyntax'],graph['badSyntax']
           for r in graph['routes']:
            assert not r['missing'] and not r['linkErrors'] and not r['cycles'] and not any(a['singleton'] for a in r['aliases']),r['entry']
          PYCODE
          node sentinel/tests/release-a77a/native.mjs "$w/unified-c"
          python3 sentinel/tests/unification78b/install-harness.py "$w/harness"
          export SENTINEL_ROOT="$w" NODE_PATH="$w/node_modules" SENTINEL_BROWSER="$(command -v google-chrome)"
          node "$w/harness/browser.cjs" unified-c all authorized quiet
          for role in anonymous denied expired renewed; do
            node "$w/harness/browser.cjs" unified-c '/admin/,/admin/ironclad/,/admin/ironclad/calculator/,/admin/orders/,/admin/delivery/,/admin/catalogue-settings/,/admin/omniscience/' "$role" quiet
          done
          python3 "$w/harness/accept-deep.py" "$w" unified-c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homecoming82-cumulative-evidence
          path: |
            ${{ runner.temp }}/dom79/graph-deepwatch.json
            ${{ runner.temp }}/dom79/unified-c-*-all.json
            ${{ runner.temp }}/dom79/unified-c-*-smoke.json
          if-no-files-found: warn
          retention-days: 30
