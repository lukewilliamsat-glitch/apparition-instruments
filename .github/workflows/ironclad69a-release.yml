name: IRONCLAD Forge protected preview and safe Admin release
on:
  push:
    branches: [engineering/phoenix66-preview]
    paths:
      - '.github/workflows/ironclad69a-release.yml'
      - 'scripts/phoenix66/ironclad69a-front.mjs'
      - 'scripts/phoenix66/ironclad69a-candidate.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: phoenix66-pages-publisher
  cancel-in-progress: false
jobs:
  isolated_acceptance:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.verify.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publisher-pin
          persist-credentials: false
      - name: Read the immutable publisher candidate pin
        id: pin
        run: |
          set -euo pipefail
          file=publisher-pin/scripts/phoenix66/ironclad69a-candidate.txt
          test "$(wc -l < "$file")" -eq 1
          candidate=$(cat "$file")
          [[ $candidate =~ ^[a-f0-9]{40}$ ]]
          remote_head=$(git -C publisher-pin ls-remote origin refs/heads/engineering/ironclad69a-forge | cut -f1)
          test "$candidate" = "$remote_head"
          printf 'sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Verify source and targeted contracts
        id: verify
        env:
          CANDIDATE: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor bf3c470b629c16f7bc883c83894fd1ae24b2c36b HEAD
          printf 'source=%s\n' "$CANDIDATE" >> "$GITHUB_OUTPUT"
          node tests/ironclad69/model.mjs
          node --check dist/admin/ironclad/app.mjs
          node --check dist/admin/ironclad/repository.mjs
          node --check dist/admin/orders/eclipse-ui.mjs
          sha256sum supabase/migrations/*ironclad*sql
      - name: Render and exercise desktop, tablet and mobile with no external routes
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ironclad69"
          mkdir -p "$d" "$RUNNER_TEMP/ironclad69-screens"
          python3 tests/ironclad69/package.py "$d/site" > "$d/inventory.json"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/ironclad69-browser" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save playwright-core@1.56.1
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          sudo unshare --net bash -eu -c '
            ip link set lo up
            test -z "$(ip route show table main)"
            test -z "$(ip -6 route show table main)"
            exec runuser -u "$1" -- env -i PATH=/usr/bin:/bin HOME="$2" CHROME_BIN="$3" PLAYWRIGHT_MODULE="$2/ironclad69-browser/node_modules/playwright-core/index.mjs" "$4" "$5" "$6" "$7"
          ' _ "$(id -un)" "$RUNNER_TEMP" "$chrome" "$(command -v node)" "$PWD/tests/ironclad69/browser.mjs" "$d/site" "$RUNNER_TEMP/ironclad69-screens"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ironclad69-screenshots
          path: ${{ runner.temp }}/ironclad69-screens
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ironclad69-tested-fixture
          path: ${{ runner.temp }}/ironclad69
          retention-days: 14
          if-no-files-found: error
  protected_preview:
    needs: isolated_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phoenix66-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ironclad69-tested-fixture
          path: ${{ runner.temp }}/ironclad69
      - name: Prepare existing pinned Cloudflare uploader
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-uploader" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false wrangler@4.162.0
      - name: Publish and verify the isolated IRONCLAD preview
        env:
          CANDIDATE: ${{ needs.isolated_acceptance.outputs.source }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHOENIX66_PAGES_EDIT_TOKEN }}
          PHOENIX66_ACCESS_CLIENT_ID: ${{ secrets.PHOENIX66_ACCESS_CLIENT_ID }}
          PHOENIX66_ACCESS_CLIENT_SECRET: ${{ secrets.PHOENIX66_ACCESS_CLIENT_SECRET }}
          WRANGLER_BIN: ${{ runner.temp }}/cloudflare-uploader/node_modules/.bin/wrangler
        run: node scripts/phoenix66/ironclad69-preview.mjs "$RUNNER_TEMP/ironclad69/site" "$RUNNER_TEMP/ironclad69/inventory.json" "$CANDIDATE"

  production_package:
    needs: [isolated_acceptance, protected_preview]
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: publisher
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.isolated_acceptance.outputs.source }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Build the exact frontend-only overlay against current Operations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.isolated_acceptance.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          pkg="$RUNNER_TEMP/ironclad69a-live"
          mkdir "$pkg"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44064826450/artifacts" | jq -e '.artifacts | map(select(.id == 14319477516 and .name == "overseer68b-operations-exact" and .expired == false and .digest == "sha256:5be3dac644fcd4732b255664c975e792f485d141f76a1aae146744db100c8a23")) | length == 1' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14319477516/zip" > "$RUNNER_TEMP/operations.zip"
          echo '5be3dac644fcd4732b255664c975e792f485d141f76a1aae146744db100c8a23  '"$RUNNER_TEMP/operations.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/operations.zip" -d "$pkg"
          node publisher/scripts/phoenix66/ironclad69a-front.mjs prepare source "$pkg" "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ironclad69a-admin-frontend-exact
          path: |
            ${{ runner.temp }}/ironclad69a-live/candidate
            ${{ runner.temp }}/ironclad69a-live/ironclad69a-receipt.json
          retention-days: 14
          if-no-files-found: error
  production_gate:
    needs: production_package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: phoenix66-production
    steps:
      - name: Keep the existing approved production target gate
        env:
          APPROVED_TARGET: ${{ vars.PHOENIX66_APPROVED_TARGET }}
        run: test "$APPROVED_TARGET" = 'apparition-instruments:production:43845328622'
  production_frontend:
    needs: [isolated_acceptance, production_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phoenix66-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ironclad69a-admin-frontend-exact
          path: ${{ runner.temp }}/ironclad69a-live
      - name: Prepare the existing pinned Cloudflare uploader
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-uploader" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false wrangler@4.162.0
      - name: Verify the production rollback and publish only the Admin calculator
        env:
          IRONCLAD69A_FRONT_ONLY: 'true'
          SOURCE: ${{ needs.isolated_acceptance.outputs.source }}
          WRANGLER_BIN: ${{ runner.temp }}/cloudflare-uploader/node_modules/.bin/wrangler
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHOENIX66_PAGES_EDIT_TOKEN }}
        run: node scripts/phoenix66/ironclad69a-front.mjs publish unused "$RUNNER_TEMP/ironclad69a-live" "$SOURCE"
