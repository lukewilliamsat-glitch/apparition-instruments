name: NIGHTWATCH synthetic release acceptance
on:
  push:
    branches: ['engineering/nightwatch-first-contact']
    paths:
      - '.github/workflows/nightwatch-synthetic.yml'
      - 'scripts/nightwatch/**'
      - 'tests/nightwatch/**'
permissions:
  contents: read
concurrency:
  group: nightwatch-synthetic
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/nightwatch-first-contact'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare synthetic evidence and identify available browser; never build site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightwatch-evidence"
          python --version > "$RUNNER_TEMP/nightwatch-evidence/python-version.txt"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -n "$browser" ]; then "$browser" --version > "$RUNNER_TEMP/nightwatch-evidence/browser-availability.txt"; fi
      - name: Process-isolated synthetic package and restoration acceptance
        shell: bash
        run: |
          set -euo pipefail
          export NIGHTWATCH_PARENT_NETNS=$(readlink /proc/self/ns/net)
          sudo --preserve-env=NIGHTWATCH_PARENT_NETNS unshare --net --mount --pid --fork --mount-proc \
            bash tests/nightwatch/run-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nightwatch-evidence" \
            "$(command -v python)" "$(id -u)" "$(id -g)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightwatch-synthetic-evidence
          path: |
            ${{ runner.temp }}/nightwatch-evidence/*.json
            ${{ runner.temp }}/nightwatch-evidence/*.txt
          if-no-files-found: error
          retention-days: 14
