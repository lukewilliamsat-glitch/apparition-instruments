name: PHANTASM 105 build and seal only
on:
  push:
    branches: [engineering/phantasm105]
    paths: [tests/phantasm105/**, .github/workflows/phantasm105-verify.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build CTS maps and seal the static application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/phantasm105"
          mkdir -p "$work"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15234105677/zip" > "$work/base.zip"
          unset GH_TOKEN
          unzip -q "$work/base.zip" -d "$work"
          npm install --prefix "$work/client" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save three@0.180.0 esbuild@0.25.10 
          cp -R tests/specimen102/src "$work/src"
          cp tests/phantasm104/src/phantasm/* "$work/src/phantasm/"
          cp tests/phantasm105/src/phantasm/* "$work/src/phantasm/"
          NODE_PATH="$work/client/node_modules" "$work/client/node_modules/.bin/esbuild" "$work/src/phantasm/scene.mjs" --bundle --minify --format=esm --outfile="$work/src/phantasm/scene.bundle.mjs"
          cp "$work/client/node_modules/three/LICENSE" "$work/src/phantasm/THREE-LICENSE.txt"
          python3 -m pip install --quiet --target "$work/build-deps" numpy==2.3.5 pillow==11.3.0
          PYTHONPATH="$work/build-deps" python3 tests/phantasm105/maps.py "$work/src/phantasm/assets"
          python3 tests/phantasm105/seal.py "$work/phantasm104-static.zip" "$work/src" "$work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phantasm105-sealed
          path: ${{ runner.temp }}/phantasm105/phantasm105-*
          if-no-files-found: error
          retention-days: 90
