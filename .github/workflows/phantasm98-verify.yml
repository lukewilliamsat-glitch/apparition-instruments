name: PHANTASM 98 WebGL and visual acceptance
on:
  push:
    branches: [engineering/phantasm98]
    paths: [tests/phantasm98/**, .github/workflows/phantasm98-verify.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build isolated renderer, verify unchanged storefront and capture visual chapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/phantasm98"
          mkdir -p "$work"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15187420835/zip" > "$work/base.zip"
          unset GH_TOKEN
          unzip -q "$work/base.zip" -d "$work"
          npm install --prefix "$work/client" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save three@0.180.0 esbuild@0.25.10 playwright-core@1.56.1 axe-core@4.11.0
          cp -R tests/phantasm98/src "$work/src"
          NODE_PATH="$work/client/node_modules" "$work/client/node_modules/.bin/esbuild" "$work/src/phantasm/scene.mjs" --bundle --minify --format=esm --outfile="$work/src/phantasm/scene.bundle.mjs"
          cp "$work/client/node_modules/three/LICENSE" "$work/src/phantasm/THREE-LICENSE.txt"
          python3 tests/phantasm98/seal.py "$work/phantasm97-static.zip" "$work/src" "$work"
          unzip -q "$work/phantasm98-static.zip" -d "$work/static"
          PHANTASM_PLAYWRIGHT="$work/client/node_modules/playwright-core" PHANTASM_CHROMIUM="$(command -v google-chrome)" PHANTASM_AXE="$work/client/node_modules/axe-core/axe.min.js" node tests/phantasm98/browser.mjs "$work/static"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phantasm98-sealed
          path: ${{ runner.temp }}/phantasm98/phantasm98-*
          if-no-files-found: error
          retention-days: 90
