name: PHOENIX 66 package and Cloudflare preview
on:
  push:
    branches: [engineering/phoenix66-preview]
    paths:
      - 'scripts/phoenix66/package.py'
      - 'scripts/phoenix66/source-pins.json'
      - 'scripts/phoenix66/smoke.mjs'
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful PHOENIX package run ID
        required: true
        type: string
      deployment_target:
        description: Explicit preview, staging, or pinned NIGHTFALL production target
        type: choice
        options: [preview, protected-baseline-stage, protected-nightfall-production, verify-nightfall-production]
        default: preview
permissions:
  contents: read
  actions: read
concurrency:
  group: phoenix66-pages-publisher
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'push' && github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Assemble and verify both complete static deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14157650445/zip" > "$RUNNER_TEMP/baseline.zip"
          python3 scripts/phoenix66/package.py "$RUNNER_TEMP/baseline.zip" "$RUNNER_TEMP/phoenix66"
          mkdir "$RUNNER_TEMP/phoenix-home"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/phoenix-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1
      - name: Verify actual deployment roots with loopback fixtures
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          sudo unshare --net bash -eu -c '
            ip link set lo up
            test -z "$(ip route show table main)"
            test -z "$(ip -6 route show table main)"
            exec runuser -u "$1" -- env -i PATH=/usr/bin:/bin HOME="$2/phoenix-home" CHROME_BIN="$3" PLAYWRIGHT_MODULE="$2/phoenix-tools/node_modules/playwright-core" "$4" "$5" "$2/phoenix66"
          ' _ "$(id -un)" "$RUNNER_TEMP" "$chrome" "$(command -v node)" "$PWD/scripts/phoenix66/smoke.mjs"
      - name: Retain immutable upload ZIPs and complete inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix66-static-uploads
          path: |
            ${{ runner.temp }}/phoenix66/baseline.zip
            ${{ runner.temp }}/phoenix66/nightfall.zip
            ${{ runner.temp }}/phoenix66/receipt.json
          retention-days: 30
          if-no-files-found: error
  preview:
    if: inputs.deployment_target != 'protected-nightfall-production' && inputs.deployment_target != 'verify-nightfall-production' && github.event_name == 'workflow_dispatch' && github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: phoenix66-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Restore a successful immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN" =~ ^[0-9]{6,16}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PACKAGE_RUN}" | jq -e --arg branch 'engineering/phoenix66-preview' '.conclusion == "success" and .head_branch == $branch and .path == ".github/workflows/phoenix66-preview.yml"' >/dev/null
          gh run download "$PACKAGE_RUN" -n phoenix66-static-uploads -D "$RUNNER_TEMP/phoenix66"
          python3 scripts/phoenix66/unpack.py "$RUNNER_TEMP/phoenix66"
          node --test scripts/phoenix66/preview-access.test.mjs
      - name: Prepare pinned Cloudflare uploader
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-uploader" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false wrangler@4.162.0
      - name: Deploy the verified payloads to the preview project only
        if: inputs.deployment_target == 'preview'
        env:
          PHOENIX66_PREVIEW_ONLY: 'true'
          WRANGLER_BIN: ${{ runner.temp }}/cloudflare-uploader/node_modules/.bin/wrangler
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHOENIX66_PAGES_EDIT_TOKEN }}
          PHOENIX66_ACCESS_CLIENT_ID: ${{ secrets.PHOENIX66_ACCESS_CLIENT_ID }}
          PHOENIX66_ACCESS_CLIENT_SECRET: ${{ secrets.PHOENIX66_ACCESS_CLIENT_SECRET }}
        run: node scripts/phoenix66/publish-preview.mjs "$RUNNER_TEMP/phoenix66"
      - name: Stage only the unchanged baseline behind verified Access
        if: inputs.deployment_target == 'protected-baseline-stage' && inputs.package_run == '43845328622'
        env:
          PHOENIX66_PRIVATE_BASELINE_STAGE: 'true'
          WRANGLER_BIN: ${{ runner.temp }}/cloudflare-uploader/node_modules/.bin/wrangler
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHOENIX66_PAGES_EDIT_TOKEN }}
        run: node scripts/phoenix66/stage-baseline.mjs "$RUNNER_TEMP/phoenix66"
  production_gate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66-preview' && (inputs.deployment_target == 'protected-nightfall-production' || inputs.deployment_target == 'verify-nightfall-production') && inputs.package_run == '43845328622'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: phoenix66-production
    steps:
      - name: Confirm configured production target
        env:
          APPROVED_TARGET: ${{ vars.PHOENIX66_APPROVED_TARGET }}
        run: test "$APPROVED_TARGET" = 'apparition-instruments:production:43845328622'
  production:
    needs: production_gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The account-scoped Pages Edit credential remains in its original branch-restricted
    # environment. Production also requires the independent gate above. No Access token
    # is passed to this job, and no preview secret or Cloudflare permission is changed.
    environment: phoenix66-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Restore only the accepted immutable release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/actions/runs/43845328622" | jq -e '.conclusion == "success" and .head_branch == "engineering/phoenix66-preview" and .path == ".github/workflows/phoenix66-preview.yml"' >/dev/null
          gh api "repos/$repo/actions/runs/43845328622/artifacts" | jq -e '.artifacts | map(select(.id == 14215042306 and .name == "phoenix66-static-uploads" and .expired == false and .digest == "sha256:0ca639d068c16783c1b7b26f1580307f1ab7a0de8d5c78c9e599fd74eabb26e8")) | length == 1' >/dev/null
          gh api "repos/$repo/actions/artifacts/14215042306/zip" > "$RUNNER_TEMP/phoenix66-package.zip"
          echo '0ca639d068c16783c1b7b26f1580307f1ab7a0de8d5c78c9e599fd74eabb26e8  '"$RUNNER_TEMP/phoenix66-package.zip" | sha256sum -c
          mkdir "$RUNNER_TEMP/phoenix66"
          for member in baseline.zip nightfall.zip receipt.json; do
            unzip -p "$RUNNER_TEMP/phoenix66-package.zip" "$member" > "$RUNNER_TEMP/phoenix66/$member"
          done
          python3 scripts/phoenix66/unpack.py "$RUNNER_TEMP/phoenix66"
      - name: Verify the candidate already served in production (read only)
        if: inputs.deployment_target == 'verify-nightfall-production'
        run: node scripts/phoenix66/production.mjs "$RUNNER_TEMP/phoenix66" --verify-served 7bfe4df0-02be-4bf2-9130-7e200be3688d
      - name: Prepare the existing pinned Cloudflare uploader
        if: inputs.deployment_target == 'protected-nightfall-production'
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-uploader" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false wrangler@4.162.0
      - name: Verify baseline, deploy exact NIGHTFALL and verify public read-back
        if: inputs.deployment_target == 'protected-nightfall-production'
        env:
          PHOENIX66_NIGHTFALL_PRODUCTION: 'true'
          WRANGLER_BIN: ${{ runner.temp }}/cloudflare-uploader/node_modules/.bin/wrangler
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHOENIX66_PAGES_EDIT_TOKEN }}
        run: node scripts/phoenix66/production.mjs "$RUNNER_TEMP/phoenix66"
