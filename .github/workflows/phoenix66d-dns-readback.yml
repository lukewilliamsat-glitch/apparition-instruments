name: PHOENIX 66F production continuity and rollback readback
on:
  push:
    branches: [engineering/phoenix66d-dns-readback]
permissions: {}
jobs:
  authoritative:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66d-dns-readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read public authoritative RRsets and pending Cloudflare mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi
          zone=apparitioninstruments.co.uk.
          query() {
            printf 'DNS66F-BEGIN %s %s %s\n' "$1" "$2" "$3"
            dig "@$1" "$2" "$3" +norecurse +dnssec +bufsize=1232 +time=4 +tries=1 +noall +comments +answer +authority +stats
            printf 'DNS66F-END\n'
          }
          for ns in chin.ns.cloudflare.com wilson.ns.cloudflare.com; do
            for type in A AAAA MX TXT CAA HTTPS; do query "$ns" "$zone" "$type"; done
            query "$ns" "www.$zone" CNAME
            query "$ns" "_domainconnect.$zone" CNAME
            query "$ns" "google._domainkey.$zone" TXT
            query "$ns" "_dmarc.$zone" TXT
          done
          for parent in dns1.nic.uk dns2.nic.uk; do
            query "$parent" "$zone" DS
            query "$parent" "$zone" NS
          done
          for resolver in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222; do
            for type in NS A MX TXT DS; do
              printf 'DNS66F-BEGIN %s %s %s\n' "$resolver" "$zone" "$type"
              dig "@$resolver" "$zone" "$type" +recurse +dnssec +bufsize=1232 +time=4 +tries=1 +noall +comments +answer +authority +stats || true
              printf 'DNS66F-END\n'
            done
            for name in www google._domainkey _domainconnect; do
              case "$name" in google._domainkey) type=TXT;; *) type=CNAME;; esac
              target="$name.$zone"
              printf 'DNS66F-BEGIN %s %s %s\n' "$resolver" "$target" "$type"
              dig "@$resolver" "$target" "$type" +recurse +dnssec +bufsize=1232 +time=4 +tries=1 +noall +comments +answer +authority +stats || true
              printf 'DNS66F-END\n'
            done
          done
      - name: Check public website, canonical redirect, owner Access and the GitHub rollback
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          apex=apparitioninstruments.co.uk
          www="www.$apex"
          q='?phoenix_cutover=one%2Btwo&probe=1'
          n=0
          for path in / /components/treble-bleeds/ /products/bleed-cap/ /products/bleed-cap/image.png /backend/component-data.mjs /wiring-kits/ /les-paul-kits/ /basket/ /checkout/ /admin/ /admin/orders/ /circuit-forge/ /wiring-generator/ /treble-bleed-designer/ /operations/snapshot.json; do
            n=$((n+1))
            url="https://$apex$path"
            if curl --silent --show-error --location --max-redirs 4 --connect-timeout 6 --max-time 14 --proto '=https' --proto-redir '=https' --dump-header "$tmp/$n.headers" -o "$tmp/$n.body" --write-out "WEB66F $path %{http_code} %{url_effective} %{remote_ip} %{ssl_verify_result} %{num_redirects} %{size_download} %{content_type}\n" "$url"; then
              origin="$(grep -iE '^server:[[:space:]]+(GitHub.com|cloudflare)' "$tmp/$n.headers" | tail -n 1 | tr -d '\r' || true)"
              printf 'WEB66F-ORIGIN %s %s\n' "$path" "$origin"
              printf 'WEB66F-SHA %s %s\n' "$path" "$(sha256sum "$tmp/$n.body" | cut -d' ' -f1)"
            fi
          done
          for route in "https://$www/components/treble-bleeds/$q" "http://$www/components/treble-bleeds/$q" "http://$apex/components/treble-bleeds/$q"; do
            curl --silent --show-error --path-as-is --connect-timeout 6 --max-time 14 -o /dev/null --write-out "REDIRECT66F $route %{http_code} %{redirect_url} %{ssl_verify_result}\n" "$route"
          done
          for host in apparition-instruments.pages.dev 69e29ee3.apparition-instruments.pages.dev apparition-phoenix-preview.pages.dev 22f0dcfe.apparition-phoenix-preview.pages.dev bf25cdcb.apparition-phoenix-preview.pages.dev; do
            curl --silent --show-error --connect-timeout 6 --max-time 14 --proto '=https' --output /dev/null --dump-header "$tmp/access" --write-out "ACCESS66F $host %{http_code} %{ssl_verify_result}\n" "https://$host/"
            if grep -iqE '^location: https://[A-Za-z0-9.-]+\.cloudflareaccess\.com/cdn-cgi/access/login/' "$tmp/access"; then
              printf 'ACCESS66F-GATED %s\n' "$host"
            fi
          done
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            curl --silent --show-error --connect-timeout 6 --max-time 14 --proto '=https' --resolve "$apex:443:$ip" -o "$tmp/rollback" --write-out "ROLLBACK66F $ip %{http_code} %{ssl_verify_result} %{remote_ip}\n" "https://$apex/"
            printf 'ROLLBACK66F-SHA %s %s\n' "$ip" "$(sha256sum "$tmp/rollback" | cut -d' ' -f1)"
          done
          curl --silent --show-error --connect-timeout 6 --max-time 14 --proto '=https' --resolve "$www:443:185.199.108.153" -o /dev/null --write-out "ROLLBACK66F-WWW %{http_code} %{redirect_url} %{ssl_verify_result}\n" "https://$www/components/treble-bleeds/$q"
