name: PHOENIX 66D authoritative DNS readback
on:
  push:
    branches: [engineering/phoenix66d-dns-readback]
permissions: {}
jobs:
  authoritative:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/phoenix66d-dns-readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read public authoritative RRsets and pending Cloudflare mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi
          zone=apparitioninstruments.co.uk.
          query() {
            printf 'DNS66D-BEGIN %s %s %s\n' "$1" "$2" "$3"
            dig "@$1" "$2" "$3" +norecurse +dnssec +bufsize=1232 +time=4 +tries=1 +noall +comments +answer +authority +stats
            printf 'DNS66D-END\n'
          }
          for ns in chin.ns.cloudflare.com wilson.ns.cloudflare.com; do
            for type in A AAAA MX TXT CAA HTTPS; do query "$ns" "$zone" "$type"; done
            query "$ns" "www.$zone" CNAME
            query "$ns" "_domainconnect.$zone" CNAME
            query "$ns" "google._domainkey.$zone" TXT
            query "$ns" "_dmarc.$zone" TXT
          done
          for parent in dns1.nic.uk dns2.nic.uk; do
            query "$parent" "$zone" DS
            query "$parent" "$zone" NS
          done
