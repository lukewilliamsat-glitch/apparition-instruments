name: Spectre hero isolated acceptance
on:
  push:
    branches: ['engineering/spectre-hero-responsive-fix']
    paths:
      - '.github/workflows/spectre35-hero.yml'
      - 'tests/spectre35/**'
      - 'dist/customer-ui.css'
permissions:
  contents: read
concurrency:
  group: spectre35-hero
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'lukewilliamsat-glitch/apparition-instruments' && github.ref == 'refs/heads/engineering/spectre-hero-responsive-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Hosted Chrome and pinned disposable controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spectre35-evidence" "$RUNNER_TEMP/spectre35-tools"
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$browser"
          printf '%s\n' "$browser" > "$RUNNER_TEMP/spectre35-tools/browser-path"
          "$browser" --version > "$RUNNER_TEMP/spectre35-evidence/browser-version.txt"
          node --version > "$RUNNER_TEMP/spectre35-evidence/node-version.txt"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/spectre35-tools" --ignore-scripts --no-audit --no-fund --package-lock=false --save=false playwright-core@1.56.1
          npm view playwright-core@1.56.1 dist.integrity > "$RUNNER_TEMP/spectre35-evidence/controller-integrity.txt"
      - name: Prove outbound isolation, then measure the actual homepage
        shell: bash
        run: |
          set -euo pipefail
          browser=$(cat "$RUNNER_TEMP/spectre35-tools/browser-path")
          sudo unshare --net --mount --pid --fork --mount-proc /bin/bash tests/spectre35/run-browser.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/spectre35-evidence" "$(command -v node)" "$browser" \
            "$RUNNER_TEMP/spectre35-tools/node_modules/playwright-core/index.mjs" "$(id -un)" "$(readlink /proc/self/ns/net)" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectre35-browser-evidence
          path: |
            ${{ runner.temp }}/spectre35-evidence/*.json
            ${{ runner.temp }}/spectre35-evidence/*.txt
            ${{ runner.temp }}/spectre35-evidence/SCREENSHOTS/*.png
          retention-days: 30
