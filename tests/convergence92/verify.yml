name: CONVERGENCE 92 settlement acceptance
on:
  push:
    branches: [engineering/convergence92]
    paths: [tests/convergence92/**, .github/workflows/convergence92-verify.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        shape: [staging, production]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55492:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 4s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
      - name: Verify exact signed settlement and the original payment writer
        env:
          TEST_SHAPE: ${{ matrix.shape }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/client" --ignore-scripts --no-audit --no-fund --package-lock=false --no-save pg@8.16.3
          if [[ "$TEST_SHAPE" = production ]]; then export PRODUCTION_SHAPE=1; fi
          PG_ORDERS_MODULE="$RUNNER_TEMP/client/node_modules/pg" node tests/convergence92/fixture.mjs
          node tests/convergence92/edge.test.mjs
          node tests/convergence92/session.test.mjs
          node tests/convergence92/session.test.mjs
          python3 tests/convergence92/seal.py "$RUNNER_TEMP/convergence92"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: convergence92-${{ matrix.shape }}-accepted
          path: ${{ runner.temp }}/convergence92/*
          if-no-files-found: error
          retention-days: 30
